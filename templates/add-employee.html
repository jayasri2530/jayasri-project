<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Employee</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #222222;
            transition: 0.3s;
        }

        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            background-color: #000000;
            padding: 15px 30px;

            display: flex;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 22px;
            font-weight: bold;
            margin-right: auto;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        .nav-links a:hover {
            color: #00bcd4;
        }

        .nav-btn {
            padding: 10px 18px;
            border-radius: 6px;
            border: 1px solid #00bcd4;
            background-color: transparent;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .register-btn {
            background-color: #00bcd4;
        }

        /* =========================
           THEME BUTTON
        ========================= */

        .theme-btn {
            padding: 10px 18px;
            border-radius: 6px;
            border: 1px solid #00bcd4;
            background-color: transparent;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        /* =========================
           FORM CONTAINER
        ========================= */

        .container {
            width: 600px;
            max-width: 90%;

            margin: 50px auto;

            padding: 30px;

            background-color: #f5f5f5;

            border-radius: 12px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);

            transition: 0.3s;
        }

        .container h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        /* =========================
           FORM
        ========================= */

        label {
            display: block;

            margin-top: 15px;
            margin-bottom: 6px;

            font-weight: bold;
        }

        input,
        select,
        textarea {

            width: 100%;

            padding: 11px;

            border: 1px solid #aaaaaa;

            border-radius: 6px;

            font-size: 15px;

            background-color: white;
            color: #222222;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #00bcd4;
        }

        /* =========================
           ADD BUTTON
        ========================= */

        .submit-btn {

            width: 100%;

            margin-top: 25px;

            padding: 12px;

            border: none;

            border-radius: 6px;

            background-color: #00bcd4;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        .submit-btn:hover {
            opacity: 0.85;
        }

        /* =========================
           DARK MODE
        ========================= */

        body.dark-mode {
            background-color: #121212;
            color: white;
        }

        body.dark-mode .container {
            background-color: #1e1e1e;

            box-shadow:
                0 5px 20px rgba(255, 255, 255, 0.08);
        }

        body.dark-mode input,
        body.dark-mode select,
        body.dark-mode textarea {

            background-color: #2b2b2b;

            color: white;

            border: 1px solid #555555;
        }

        body.dark-mode label {
            color: white;
        }

        body.dark-mode .theme-btn {
            background-color: white;
            color: black;
        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================= -->

    <div class="navbar">

        <div class="logo">
            Employee Management System
        </div>


        <div class="nav-links">

            <a href="/home">
                Home
            </a>

            <a href="/employee">
                Employees
            </a>

            <a href="/add-employee">
                Add Employee
            </a>

            <a href="/search">
                Search
            </a>

            <a href="/login">
                <button class="nav-btn">
                    Login
                </button>
            </a>

            <a href="/register">
                <button class="nav-btn register-btn">
                    Register
                </button>
            </a>

            <button
                class="theme-btn"
                id="themeButton"
                onclick="toggleTheme()">

                🌙 Dark

            </button>

        </div>

    </div>


    <!-- =========================
         ADD EMPLOYEE FORM
    ========================= -->

    <div class="container">

        <h1>
            Add Employee
        </h1>


        <form
            action="/add-employee"
            method="POST">


            <!-- NAME -->

            <label for="name">
                Employee Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter employee name"
                required>


            <!-- EMAIL -->

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter email"
                required>


            <!-- PHONE -->

            <label for="phone">
                Phone
            </label>

            <input
                type="text"
                id="phone"
                name="phone"
                placeholder="Enter phone number"
                required>


            <!-- DEPARTMENT -->

            <label for="department">
                Department
            </label>

            <input
                type="text"
                id="department"
                name="department"
                placeholder="Enter department"
                required>


            <!-- SALARY -->

            <label for="salary">
                Salary
            </label>

            <input
                type="number"
                id="salary"
                name="salary"
                placeholder="Enter salary"
                required>


            <!-- ADDRESS  -->

            <label for="address">
                Address
            </label>

            <textarea
                id="address"
                name="address"
                placeholder="Enter employee address"></textarea>


            <!-- JOINING DATE -->

            <label for="joining_date">
                Joining Date
            </label>

            <input
                type="date"
                id="joining_date,"
                name="joining_date"
                required>

            <!-- SUBMIT -->

            <button
                type="submit"
                class="submit-btn">

                Add Employee

            </button>


        </form>

    </div>


    <!-- =========================
         THEME JAVASCRIPT
    ========================= -->

    <script>

        function updateThemeButton() {

            const button =
                document.getElementById("themeButton");

            if (
                document.body.classList.contains("dark-mode")
            ) {

                button.innerHTML = "☀️ Light";

            } else {

                button.innerHTML = "🌙 Dark";

            }
        }


        function toggleTheme() {

            if (
                document.body.classList.contains("dark-mode")
            ) {

                document.body.classList.remove(
                    "dark-mode"
                );

                localStorage.setItem(
                    "theme",
                    "light"
                );

            } else {

                document.body.classList.add(
                    "dark-mode"
                );

                localStorage.setItem(
                    "theme",
                    "dark"
                );
            }


            updateThemeButton();

        }


        /* Saved theme */

        const savedTheme =
            localStorage.getItem("theme");


        if (savedTheme === "dark") {

            document.body.classList.add(
                "dark-mode"
            );

        }


        updateThemeButton();

    </script>


</body>

</html>

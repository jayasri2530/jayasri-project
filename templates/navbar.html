<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Employee Management System</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            background-color: #ffffff;
            color: #222222;

            transition: background-color 0.3s,
                        color 0.3s;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar {

            background-color: #222222;

            padding: 15px 30px;

            display: flex;
            align-items: center;
        }


        .logo {

            color: white;

            font-size: 22px;

            font-weight: bold;

            margin-right: auto;
        }


        .nav-links {

            display: flex;

            align-items: center;

            gap: 18px;
        }


        .nav-links a {

            color: white;

            text-decoration: none;

            font-size: 16px;
        }


        .nav-links a:hover {

            color: #00bcd4;
        }


        /* =========================
           BUTTONS
        ========================= */

        .nav-btn {

            padding: 9px 15px;

            border-radius: 6px;

            border: 1px solid #00bcd4;

            background-color: transparent;

            color: white;

            cursor: pointer;

            font-size: 14px;
        }


        .register-btn {

            background-color: #00bcd4;

            color: white;
        }


        .theme-btn {

            padding: 9px 15px;

            border-radius: 6px;

            border: 1px solid #00bcd4;

            background-color: transparent;

            color: white;

            cursor: pointer;

            font-size: 14px;
        }


        .theme-btn:hover {

            opacity: 0.85;
        }


        /* =========================
           HOME CONTENT
        ========================= */

        .home-content {

            text-align: center;

            padding: 80px 20px;
        }


        .home-content h1 {

            font-size: 36px;

            margin-bottom: 15px;
        }


        .home-content p {

            font-size: 18px;
        }


        /* =========================
           DARK MODE
        ========================= */

        body.dark-mode {

            background-color: #121212;

            color: white;
        }


        body.dark-mode .navbar {

            background-color: #000000;
        }


        body.dark-mode .theme-btn {

            background-color: white;

            color: black;
        }


        body.dark-mode .home-content {

            color: white;
        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================= -->

    <div class="navbar">


        <div class="logo">

            Employee Management System

        </div>


        <div class="nav-links">


            <a href="/home">
                Home
            </a>


            <a href="/employee">
                Employees
            </a>


            <a href="/add-employee">
                Add Employee
            </a>


            <a href="/search">
                Search
            </a>


            <a href="/login">

                <button class="nav-btn">
                    Login
                </button>

            </a>


            <a href="/register">

                <button
                    class="nav-btn register-btn">

                    Register

                </button>

            </a>


            <!-- THEME BUTTON -->

            <button
                class="theme-btn"
                id="themeButton"
                onclick="toggleTheme()">

                🌙 Dark

            </button>


        </div>

    </div>


    <!-- =========================
         HOME PAGE
    ========================= -->

    <div class="home-content">

        <h1>
            Welcome to Employee Management System
        </h1>


        <p>
            Manage your employees easily.
        </p>

    </div>


    <!-- =========================
         THEME JAVASCRIPT
    ========================= -->

    <script>


        function updateThemeButton() {

            const button =
                document.getElementById("themeButton");


            if (
                document.body.classList.contains(
                    "dark-mode"
                )
            ) {

                button.innerHTML = "☀️ Light";

            } else {

                button.innerHTML = "🌙 Dark";

            }

        }


        function toggleTheme() {


            if (
                document.body.classList.contains(
                    "dark-mode"
                )
            ) {


                document.body.classList.remove(
                    "dark-mode"
                );


                localStorage.setItem(
                    "theme",
                    "light"
                );


            } else {


                document.body.classList.add(
                    "dark-mode"
                );


                localStorage.setItem(
                    "theme",
                    "dark"
                );

            }


            updateThemeButton();

        }


        /* =========================
           SAVED THEME
        ========================= */


        const savedTheme =
            localStorage.getItem("theme");


        if (savedTheme === "dark") {

            document.body.classList.add(
                "dark-mode"
            );

        }


        updateThemeButton();


    </script>


</body>

</html>
